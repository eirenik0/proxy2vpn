name: Monitoring rules
on:
  push:
    branches: [main]
    paths: ['monitoring/**', '.github/workflows/monitoring.yml']
  pull_request:
    paths: ['monitoring/**', '.github/workflows/monitoring.yml']
  workflow_dispatch:
jobs:
  promtool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate documented Compose setup
        env:
          GRAFANA_ADMIN_PASSWORD: ci-config-validation-only
        run: docker compose -f monitoring/compose.yml config --quiet
      - name: Validate and test alert rules
        run: |
          docker run --rm --entrypoint /bin/promtool -v "$PWD/monitoring:/work:ro" -w /work prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996 check rules rules.yml
          docker run --rm --entrypoint /bin/promtool -v "$PWD/monitoring:/work:ro" -w /work prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996 test rules rules.test.yml
