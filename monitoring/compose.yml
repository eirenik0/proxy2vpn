name: proxy2vpn-monitoring-demo
services:
  producer:
    build:
      context: ..
      dockerfile: monitoring/Dockerfile
    command: [python, /app/demo.py]
    environment:
      DEMO_CONNECTIVITY_FAILURE: ${DEMO_CONNECTIVITY_FAILURE:-0}
    volumes:
      - demo-evidence:/evidence
    networks: [monitoring]
  exporter:
    build:
      context: ..
      dockerfile: monitoring/Dockerfile
    # Explicit private container IP; its port is not published to the host.
    command: [proxy2vpn, --compose-file, /evidence/compose.yml, agent, metrics, --bind-address, 172.29.143.10]
    volumes:
      - demo-evidence:/evidence:ro
    networks:
      monitoring:
        ipv4_address: 172.29.143.10
  prometheus:
    image: prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    ports: ["127.0.0.1:19090:9090"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./rules.yml:/etc/prometheus/rules.yml:ro
    networks: [monitoring]
  alertmanager:
    image: prom/alertmanager:v0.28.1@sha256:27c475db5fb156cab31d5c18a4251ac7ed567746a2483ff264516437a39b15ba
    ports: ["127.0.0.1:19093:9093"]
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    networks: [monitoring]
  grafana:
    image: grafana/grafana:12.1.0@sha256:6ac590e7cabc2fbe8d7b8fc1ce9c9f0582177b334e0df9c927ebd9670469440f
    ports: ["127.0.0.1:13000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD for local Grafana}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [monitoring]
volumes:
  demo-evidence:
networks:
  monitoring:
    ipam:
      config:
        - subnet: 172.29.143.0/24
