name: Publish to PyPI

on:
  release:
    types:
      - published

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/proxy2vpn
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Validate release provenance
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          case "$RELEASE_TAG" in
            v*) version="${RELEASE_TAG#v}" ;;
            *) echo "Release tag must start with v: ${RELEASE_TAG}"; exit 1 ;;
          esac

          git fetch origin "$DEFAULT_BRANCH"
          git merge-base --is-ancestor HEAD "origin/$DEFAULT_BRANCH" || {
            echo "Release tag ${RELEASE_TAG} is not contained in ${DEFAULT_BRANCH}."
            exit 1
          }

          python - "$version" <<'PY'
          import pathlib
          import sys
          import tomllib

          version = sys.argv[1]
          metadata = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          if metadata["project"]["version"] != version:
              raise SystemExit("Release tag and pyproject.toml version do not match")

          changelog = pathlib.Path("CHANGELOG.md").read_text()
          if f"## [{version}]" not in changelog:
              raise SystemExit(f"CHANGELOG.md has no {version} release entry")
          PY

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
